framework:
    workflows:
        # Review lifecycle of translation revisions (F9.9, epic #612).
        # Auto-snapshots from direct editor saves are born `validated` without
        # traversing the machine; only translator submissions run through it.
        translation_review:
            type: state_machine
            audit_trail:
                enabled: true
            marking_store:
                type: method
                property: marking
            supports:
                - App\Entity\PageTranslationRevision
                - App\Entity\ArchetypeTranslationRevision
                - App\Entity\MenuCategoryTranslationRevision
                - App\Entity\DeckTranslationRevision
                - App\Entity\BannedCardTranslationRevision
                - App\Entity\StapleCardTranslationRevision
            initial_marking: draft
            places:
                - draft
                - pending_review
                - validated
                - rejected
            transitions:
                submit:
                    from: draft
                    to: pending_review
                approve:
                    from: pending_review
                    to: validated
                reject:
                    from: pending_review
                    to: rejected
                rework:
                    from: rejected
                    to: draft
        borrow:
            type: state_machine
            audit_trail:
                enabled: true
            marking_store:
                type: method
                property: marking
            supports:
                - App\Entity\Borrow
            initial_marking: pending
            places:
                - pending
                - approved
                - lent
                - returned
                - returned_to_owner
                - cancelled
                - overdue
            transitions:
                approve:
                    from: pending
                    to: approved
                deny:
                    from: pending
                    to: cancelled
                cancel_pending:
                    from: pending
                    to: cancelled
                cancel_approved:
                    from: approved
                    to: cancelled
                hand_off:
                    from: approved
                    to: lent
                return:
                    from: lent
                    to: returned
                return_overdue:
                    from: overdue
                    to: returned
                return_to_owner:
                    from: returned
                    to: returned_to_owner
                walk_up_lend:
                    from: pending
                    to: lent
                mark_overdue:
                    from: lent
                    to: overdue
